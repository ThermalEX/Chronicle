[workspace]
resolver = "3"
members = [
    "crates/chronicle-core",
    "crates/chronicle-storage",
    "crates/chronicle-sync",
]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
