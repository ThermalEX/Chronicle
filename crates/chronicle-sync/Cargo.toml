[package]
name = "chronicle-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
opendal = { version = "=0.59.1", default-features = false, features = ["auto-register-services", "http-transport-reqwest", "executors-tokio", "layers-retry", "layers-timeout", "layers-concurrent-limit", "services-github", "services-webdav", "services-s3", "services-b2", "services-azblob", "services-gcs", "services-oss", "services-cos", "services-obs", "services-tos", "services-swift"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.47.1", features = ["fs", "time", "sync"] }
uuid = { version = "1.18.1", features = ["v4"] }
thiserror = "2.0.16"
chronicle-core = { path = "../chronicle-core" }
base64 = "0.22.1"
urlencoding = "2.1.3"

[dev-dependencies]
opendal = { version = "=0.59.1", default-features = false, features = ["services-memory"] }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
