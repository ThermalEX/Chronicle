[package]
name = "chronicle-desktop"
version = "1.3.6"
description = "Chronicle desktop application"
authors = ["ThermalEX <2210692765@qq.com>"]
edition = "2024"
rust-version = "1.97"

[lib]
name = "chronicle_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chronicle-core = { path = "../../../crates/chronicle-core" }
chronicle-storage = { path = "../../../crates/chronicle-storage" }
chronicle-sync = { path = "../../../crates/chronicle-sync" }
keyring = { version = "3.6.3", features = ["windows-native"] }
sha2 = "0.10.9"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
uuid = { version = "1.18.1", features = ["v4"] }
walkdir = "2.5.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
glob = "0.3"
dirs = "6"
serde_yaml_ng = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
notify = "8.2.0"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls"] }
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-notification = "2.4.0"
tauri-plugin-window-state = "=2.4.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
opendal = { version = "=0.59.1", default-features = false, features = ["services-memory"] }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
